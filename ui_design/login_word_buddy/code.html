<style>
        .input-glow:focus {
            box-shadow: 0 0 0 2px rgba(77, 65, 223, 0.3);

<body class="bg-surface-subtle min-h-screen flex items-center justify-center p-page-margin-mb md:p-page-margin-dt antialiased selection:bg-primary-fixed selection:text-on-primary-fixed">
<div class="w-full max-w-md bg-surface-base rounded-[16px] shadow-level-1 overflow-hidden transition-all duration-300 hover:-translate-y-1">
<div class="p-8 md:p-10 flex flex-col items-center">
<!-- Mascot/Logo Area -->
<div class="w-24 h-24 rounded-full bg-surface-container-low flex items-center justify-center mb-6">
<!-- Using a material icon as a placeholder for the friendly owl mascot -->
<span class="material-symbols-outlined text-[48px] text-primary" style="font-variation-settings: 'FILL' 1;">cruelty_free</span>
</div>
<!-- Header -->
<div class="text-center mb-8">
<h1 class="font-headline-lg text-headline-lg text-on-surface mb-2">Word Buddy</h1>
<p class="font-body-sm text-body-sm text-text-muted">Welcome back! Ready to learn?</p>
</div>
<!-- Form -->
<form class="w-full space-y-4">
<div>
<label class="sr-only" for="email">Email address</label>
<input class="w-full h-component-height px-4 rounded-[10px] border border-border-base bg-surface-base text-on-surface font-body-lg text-body-lg focus:outline-none focus:border-primary input-glow transition-all duration-150 placeholder:text-text-muted" id="email" name="email" placeholder="Email address" required="" type="email"/>
</div>
<div>
<label class="sr-only" for="password">Password</label>
<input class="w-full h-component-height px-4 rounded-[10px] border border-border-base bg-surface-base text-on-surface font-body-lg text-body-lg focus:outline-none focus:border-primary input-glow transition-all duration-150 placeholder:text-text-muted" id="password" name="password" placeholder="Password" required="" type="password"/>
</div>
<div class="flex items-center justify-between mt-2 mb-6">
<div class="flex items-center">
<input class="h-4 w-4 text-primary focus:ring-primary border-border-base rounded text-primary" id="remember-me" name="remember-me" type="checkbox"/>
<label class="ml-2 block font-label-md text-label-md text-on-surface-variant" for="remember-me">
                            Remember me
                        </label>
</div>
<div class="font-label-md text-label-md">
<a class="text-primary hover:text-primary-container transition-colors duration-200" href="#">Forgot password?</a>
</div>
</div>
<button class="w-full h-component-height bg-primary text-on-primary font-label-md text-label-md rounded-[12px] flex items-center justify-center transition-transform duration-200 hover:scale-[1.02] active:scale-95 shadow-sm" type="submit">
                    Sign In
                </button>
</form>
<!-- Divider -->
<div class="w-full flex items-center gap-4 my-6">
<div class="flex-1 h-px bg-border-base"></div>
<span class="font-label-md text-label-md text-text-muted">or</span>
<div class="flex-1 h-px bg-border-base"></div>
</div>
<!-- Social Login -->
<button class="w-full h-component-height bg-surface-base border border-border-base text-on-surface font-label-md text-label-md rounded-[12px] flex items-center justify-center gap-2 transition-colors duration-200 hover:bg-surface-subtle" type="button">
<svg class="w-5 h-5" fill="none" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"></path>
<path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"></path>
<path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"></path>
<path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"></path>
</svg>
                Continue with Google
            </button>
<!-- Footer -->
<p class="mt-8 font-body-sm text-body-sm text-text-muted">
                Don't have an account? <a class="text-primary font-medium hover:underline transition-all" href="#">Register here</a>
</p>
</div>
