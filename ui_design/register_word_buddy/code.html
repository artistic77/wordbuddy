<style>
        .card-shadow {
            box-shadow: 0 4px 20px rgba(108, 99, 255, 0.08);

<body class="bg-surface-subtle min-h-screen flex items-center justify-center p-page-margin-mb md:p-page-margin-dt">
<!-- Registration Card -->
<main class="w-full max-w-md bg-surface-base rounded-[16px] card-shadow p-8 flex flex-col relative overflow-hidden">
<!-- Subtle Brand Accent (Top border line) -->
<div class="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-primary to-primary-fixed"></div>
<!-- Header -->
<div class="text-center mb-8">
<h1 class="font-headline-lg text-headline-lg-mobile md:text-headline-lg text-on-surface mb-2">Word Buddy</h1>
<p class="font-body-lg text-body-lg text-text-muted">Create your account</p>
</div>
<!-- Form -->
<form action="#" class="flex flex-col gap-5" method="POST">
<!-- Display Name -->
<div class="flex flex-col gap-1.5">
<label class="font-label-md text-label-md text-on-surface" for="displayName">Display Name</label>
<div class="relative input-focus input-transition border border-border-base rounded-[10px] bg-surface-base h-[48px] flex items-center overflow-hidden">
<span class="material-symbols-outlined absolute left-3 text-text-muted" data-icon="person">person</span>
<input class="w-full h-full bg-transparent border-none pl-10 pr-3 font-body-lg text-body-lg text-on-surface placeholder:text-text-muted/60 focus:ring-0" id="displayName" name="displayName" placeholder="How should we call you?" required="" type="text"/>
</div>
</div>
<!-- Email -->
<div class="flex flex-col gap-1.5">
<label class="font-label-md text-label-md text-on-surface" for="email">Email</label>
<div class="relative input-focus input-transition border border-border-base rounded-[10px] bg-surface-base h-[48px] flex items-center overflow-hidden">
<span class="material-symbols-outlined absolute left-3 text-text-muted" data-icon="mail">mail</span>
<input class="w-full h-full bg-transparent border-none pl-10 pr-3 font-body-lg text-body-lg text-on-surface placeholder:text-text-muted/60 focus:ring-0" id="email" name="email" placeholder="you@example.com" required="" type="email"/>
</div>
</div>
<!-- Password -->
<div class="flex flex-col gap-1.5">
<label class="font-label-md text-label-md text-on-surface" for="password">Password</label>
<div class="relative input-focus input-transition border border-border-base rounded-[10px] bg-surface-base h-[48px] flex items-center overflow-hidden">
<span class="material-symbols-outlined absolute left-3 text-text-muted" data-icon="lock">lock</span>
<input class="w-full h-full bg-transparent border-none pl-10 pr-3 font-body-lg text-body-lg text-on-surface placeholder:text-text-muted/60 focus:ring-0" id="password" name="password" placeholder="••••••••" required="" type="password"/>
</div>
</div>
<!-- Confirm Password -->
<div class="flex flex-col gap-1.5">
<label class="font-label-md text-label-md text-on-surface" for="confirmPassword">Confirm Password</label>
<div class="relative input-focus input-transition border border-border-base rounded-[10px] bg-surface-base h-[48px] flex items-center overflow-hidden">
<span class="material-symbols-outlined absolute left-3 text-text-muted" data-icon="lock_reset">lock_reset</span>
<input class="w-full h-full bg-transparent border-none pl-10 pr-3 font-body-lg text-body-lg text-on-surface placeholder:text-text-muted/60 focus:ring-0" id="confirmPassword" name="confirmPassword" placeholder="••••••••" required="" type="password"/>
</div>
</div>
<!-- Submit Button -->
<button class="mt-2 w-full h-[48px] bg-primary text-on-primary rounded-[12px] font-label-md text-label-md flex items-center justify-center transition-transform duration-200 hover:scale-[1.02] active:scale-[0.98]" type="submit">
                Create Account
            </button>
</form>
<!-- Footer Links -->
<div class="mt-6 text-center font-body-sm text-body-sm text-text-muted">
            Already have an account? <a class="text-primary hover:text-primary-fixed transition-colors font-medium" href="#">Log in</a>
</div>
</main>
