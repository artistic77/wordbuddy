<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Word Buddy - Add Vocabulary</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&amp;family=Inter:wght@400;500&amp;family=Sarabun:wght@400;500&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "surface-base": "#FFFFFF",
                        "primary-fixed": "#e3dfff",
                        "on-tertiary-container": "#fffbff",
                        "tertiary-container": "#b65c00",
                        "on-surface-variant": "#464555",
                        "surface": "#f9f9ff",
                        "on-primary-container": "#fffbff",
                        "surface-container-high": "#e1e8fd",
                        "on-secondary-fixed": "#181b26",
                        "warning": "#FFD166",
                        "secondary-fixed-dim": "#c3c6d4",
                        "inverse-on-surface": "#edf0ff",
                        "text-muted": "#6B7280",
                        "surface-dim": "#d3daef",
                        "primary-fixed-dim": "#c4c0ff",
                        "tertiary": "#914800",
                        "secondary-fixed": "#e0e2f0",
                        "outline": "#777587",
                        "surface-container": "#e9edff",
                        "on-tertiary-fixed-variant": "#713700",
                        "on-error-container": "#93000a",
                        "on-tertiary": "#ffffff",
                        "on-background": "#141b2b",
                        "surface-container-low": "#f1f3ff",
                        "surface-bright": "#f9f9ff",
                        "on-primary-fixed": "#100069",
                        "on-secondary": "#ffffff",
                        "on-secondary-container": "#5f626f",
                        "surface-tint": "#4f44e2",
                        "inverse-primary": "#c4c0ff",
                        "on-primary": "#ffffff",
                        "outline-variant": "#c7c4d8",
                        "secondary": "#5b5e6a",
                        "surface-container-highest": "#dce2f7",
                        "surface-container-lowest": "#ffffff",
                        "surface-subtle": "#F9FAFB",
                        "on-primary-fixed-variant": "#3622ca",
                        "on-error": "#ffffff",
                        "tertiary-fixed": "#ffdcc6",
                        "background": "#f9f9ff",
                        "on-secondary-fixed-variant": "#434652",
                        "error": "#FF6B6B",
                        "on-surface": "#141b2b",
                        "surface-variant": "#dce2f7",
                        "border-base": "#E5E7EB",
                        "tertiary-fixed-dim": "#ffb785",
                        "primary": "#4d41df",
                        "on-tertiary-fixed": "#301400",
                        "primary-container": "#675df9",
                        "success": "#06D6A0",
                        "error-container": "#ffdad6",
                        "inverse-surface": "#293040",
                        "secondary-container": "#dddfee"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "page-margin-mb": "24px",
                        "page-margin-dt": "48px",
                        "gutter": "16px",
                        "max-width-modal": "600px",
                        "component-height": "48px"
                    },
                    "fontFamily": {
                        "headline-lg": ["Outfit"],
                        "body-lg": ["Inter"],
                        "headline-lg-mobile": ["Outfit"],
                        "label-md": ["Inter"],
                        "thai-display": ["Sarabun"],
                        "headline-md": ["Outfit"],
                        "body-sm": ["Inter"],
                        "display-hero": ["Outfit"],
                        "headline-sm": ["Outfit"]
                    },
                    "fontSize": {
                        "headline-lg": ["32px", { "lineHeight": "40px", "fontWeight": "700" }],
                        "body-lg": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],
                        "headline-lg-mobile": ["28px", { "lineHeight": "36px", "fontWeight": "700" }],
                        "label-md": ["13px", { "lineHeight": "16px", "letterSpacing": "0.02em", "fontWeight": "500" }],
                        "thai-display": ["28px", { "lineHeight": "1.4", "fontWeight": "500" }],
                        "headline-md": ["24px", { "lineHeight": "32px", "fontWeight": "600" }],
                        "body-sm": ["14px", { "lineHeight": "20px", "fontWeight": "400" }],
                        "display-hero": ["40px", { "lineHeight": "1.2", "fontWeight": "700" }],
                        "headline-sm": ["18px", { "lineHeight": "24px", "fontWeight": "600" }]
                    }
                }
            }
        }
    </script>
<style>
        .modal-shadow {
            box-shadow: 0 8px 40px rgba(0, 0, 0, 0.12);
        }
        .input-glow:focus-within {
            box-shadow: 0 0 0 2px rgba(103, 93, 249, 0.3);
            border-color: #4d41df;
        }
        .tab-active {
            border-bottom: 2px solid #4d41df;
            color: #4d41df;
        }
    </style>
</head>
<body class="bg-surface-subtle font-body-lg text-on-surface h-screen w-screen flex items-center justify-center p-page-margin-mb md:p-page-margin-dt overflow-hidden">
<!-- Modal Backdrop -->
<div class="fixed inset-0 bg-on-surface/20 backdrop-blur-sm flex items-center justify-center z-50">
<!-- Modal Container -->
<div class="bg-surface-base w-full max-w-max-width-modal rounded-[16px] modal-shadow flex flex-col overflow-hidden relative scale-100 transition-transform duration-300">
<!-- Header -->
<div class="flex items-center justify-between px-6 py-4 border-b border-border-base">
<h2 class="font-headline-md text-headline-md text-on-surface">Add Vocabulary</h2>
<button class="text-on-surface-variant hover:text-on-surface transition-colors">
<span class="material-symbols-outlined" data-icon="close">close</span>
</button>
</div>
<!-- Tabs -->
<div class="flex px-6 border-b border-border-base gap-6">
<button class="py-3 font-label-md text-label-md tab-active transition-colors" id="tab-type">Type Word</button>
<button class="py-3 font-label-md text-label-md text-on-surface-variant hover:text-on-surface transition-colors" id="tab-upload">Photo/Upload</button>
</div>
<!-- Content Area - Type Word -->
<div class="p-6 flex flex-col gap-6" id="content-type">
<!-- Input Row -->
<div class="flex gap-4 items-start">
<div class="flex-1 flex flex-col gap-2 relative">
<label class="font-label-md text-label-md text-secondary">English Word</label>
<div class="relative flex items-center">
<input class="w-full h-component-height rounded-[10px] border border-border-base px-4 font-body-lg text-body-lg focus:outline-none input-glow transition-all duration-150" placeholder="e.g., Ephemeral" type="text"/>
</div>
</div>
<div class="flex items-end h-full mt-7">
<button class="bg-primary text-on-primary h-component-height px-6 rounded-[12px] font-label-md text-label-md hover:scale-102 hover:bg-primary-container transition-all duration-200 flex items-center justify-center shadow-sm">
                            Translate
                        </button>
</div>
</div>
<hr class="border-border-base"/>
<!-- Auto-filled Results area (simulated state) -->
<div class="flex flex-col gap-4">
<div class="flex items-center gap-3">
<span class="font-thai-display text-thai-display text-on-surface">ชั่วคราว</span>
<span class="bg-surface-container-high text-on-surface-variant px-2 py-1 rounded font-label-md text-label-md">adj</span>
</div>
<div class="flex flex-col gap-2">
<label class="font-label-md text-label-md text-secondary">Example Sentence</label>
<div class="p-3 bg-surface-subtle rounded-[10px] border border-border-base font-body-lg text-body-lg text-on-surface-variant">
                            The beauty of a sunset is <strong class="text-on-surface">ephemeral</strong>, lasting only a few moments.
                        </div>
</div>
</div>
</div>
<!-- Content Area - Photo/Upload (Hidden by default) -->
<div class="p-6 flex flex-col gap-6 hidden" id="content-upload">
<div class="border-2 border-dashed border-outline-variant rounded-[16px] h-48 flex flex-col items-center justify-center bg-surface-subtle hover:bg-surface-container-low transition-colors cursor-pointer group">
<span class="material-symbols-outlined text-4xl text-outline-variant group-hover:text-primary transition-colors mb-2" data-icon="cloud_upload">cloud_upload</span>
<p class="font-label-md text-label-md text-on-surface-variant">Drag and drop an image, or click to browse</p>
<p class="font-body-sm text-body-sm text-text-muted mt-1">Extract text from photos of books or notes</p>
</div>
</div>
<!-- Footer Actions -->
<div class="px-6 py-4 border-t border-border-base flex justify-end gap-3 bg-surface-subtle mt-auto">
<button class="h-component-height px-6 rounded-[12px] font-label-md text-label-md border border-primary text-primary hover:bg-inverse-on-surface transition-colors duration-200 bg-transparent">Cancel</button>
<button class="h-component-height px-6 rounded-[12px] font-label-md text-label-md bg-primary text-on-primary hover:scale-102 hover:bg-primary-container transition-all duration-200 shadow-sm flex items-center gap-2">
<span class="material-symbols-outlined text-sm" data-icon="add">add</span> Add to Set
                </button>
</div>
</div>
</div>
<script>
        // Simple tab switching logic
        const tabType = document.getElementById('tab-type');
        const tabUpload = document.getElementById('tab-upload');
        const contentType = document.getElementById('content-type');
        const contentUpload = document.getElementById('content-upload');

        tabType.addEventListener('click', () => {
            tabType.classList.add('tab-active');
            tabType.classList.remove('text-on-surface-variant');
            
            tabUpload.classList.remove('tab-active');
            tabUpload.classList.add('text-on-surface-variant');

            contentType.classList.remove('hidden');
            contentUpload.classList.add('hidden');
        });

        tabUpload.addEventListener('click', () => {
            tabUpload.classList.add('tab-active');
            tabUpload.classList.remove('text-on-surface-variant');
            
            tabType.classList.remove('tab-active');
            tabType.classList.add('text-on-surface-variant');

            contentUpload.classList.remove('hidden');
            contentType.classList.add('hidden');
        });
    </script>
</body></html>
