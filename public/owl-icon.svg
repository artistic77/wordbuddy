<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="owlBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6C63FF" />
      <stop offset="100%" stop-color="#4B44B8" />
    </linearGradient>
    <linearGradient id="owlBelly" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EEF0FF" />
      <stop offset="100%" stop-color="#FFFFFF" />
    </linearGradient>
    <linearGradient id="owlBeak" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD166" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
  </defs>

  <!-- Owl Body -->
  <rect x="20" y="24" width="60" height="66" rx="30" fill="url(#owlBody)" />

  <!-- Ears / Horn Tufts -->
  <polygon points="22,28 32,8 40,26" fill="#5A52E0" />
  <polygon points="78,28 68,8 60,26" fill="#5A52E0" />

  <!-- Belly -->
  <ellipse cx="50" cy="62" rx="22" ry="24" fill="url(#owlBelly)" />

  <!-- Eyes Background -->
  <circle cx="38" cy="38" r="14" fill="#FFFFFF" />
  <circle cx="62" cy="38" r="14" fill="#FFFFFF" />

  <!-- Pupils -->
  <circle cx="40" cy="38" r="8" fill="#1A1A2E" />
  <circle cx="60" cy="38" r="8" fill="#1A1A2E" />

  <!-- Eye Highlights -->
  <circle cx="38" cy="35" r="3" fill="#FFFFFF" />
  <circle cx="58" cy="35" r="3" fill="#FFFFFF" />
  <circle cx="42" cy="40" r="1.5" fill="#FFFFFF" />
  <circle cx="62" cy="40" r="1.5" fill="#FFFFFF" />

  <!-- Beak -->
  <polygon points="50,42 43,51 57,51" fill="url(#owlBeak)" />

  <!-- Wings -->
  <path d="M 20 46 C 14 54, 14 68, 22 76" stroke="#5A52E0" stroke-width="4" stroke-linecap="round" fill="none" />
  <path d="M 80 46 C 86 54, 86 68, 78 76" stroke="#5A52E0" stroke-width="4" stroke-linecap="round" fill="none" />

  <!-- Feet -->
  <ellipse cx="40" cy="90" rx="6" ry="3" fill="#FFD166" />
  <ellipse cx="60" cy="90" rx="6" ry="3" fill="#FFD166" />
</svg>
